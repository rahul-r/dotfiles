# Static translation of wayland.windowManager.hyprland from home/hyprland/default.nix.
# Linux desktop (blackhole) only. Home Manager's nixGL wrapper and its
# /tmp/hyprland.desktop activation hook are intentionally not reproduced; use
# the distro's Hyprland package and wayland session entry instead (see README.md).

$terminal = alacritty
$fileManager = nautilus
$webbrowser = flatpak run com.brave.Browser
$menu = rofi -show drun
$mod = SUPER

# The source settings declare the workspace 1-10 binds twice: once explicitly
# and once through the generated list. Both sets are kept verbatim.
bind = , Print, exec, grimblast copy area
bind = $mod, RETURN, exec, $terminal
bind = $mod SHIFT, Q, killactive,
bind = $mod, M, exit,
bind = $mod, E, exec, $fileManager
bind = $mod, B, exec, $webbrowser
bind = $mod, V, togglefloating,
bind = $mod, R, exec, $menu
bind = ALT, SPACE, exec, $menu
bind = $mod, SHIFT R, exec, krunner
bind = $mod, P, pseudo,
bind = $mod, T, togglesplit,

# Move focus with mod + arrow keys
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, J, movefocus, u
bind = $mod, L, movefocus, d

# Switch workspaces with mod + [0-9]
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# Move active window to a workspace with mod + SHIFT + [0-9]
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mod, S, togglespecialworkspace, magic
bind = $mod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mod + scroll
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

# Generated workspace binds (duplicates of the explicit list above)
bind = $mod, 1, workspace, 1
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod, 2, workspace, 2
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod, 3, workspace, 3
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod, 4, workspace, 4
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod, 5, workspace, 5
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod, 6, workspace, 6
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod, 7, workspace, 7
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod, 8, workspace, 8
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod, 9, workspace, 9
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod, 0, workspace, 10
bind = $mod SHIFT, 0, movetoworkspace, 10

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

animations {
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 7, myBezier
    enabled = yes
}

decoration {
    blur {
        enabled = true
        passes = 1
        size = 3
    }
    col.shadow = rgba(1a1a1aee)
    drop_shadow = yes
    rounding = 10
    shadow_range = 4
    shadow_render_power = 3
}

dwindle {
    preserve_split = yes
    pseudotile = yes
}

general {
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    gaps_in = 5
    gaps_out = 20
    layout = dwindle
}

gestures {
    workspace_swipe = off
}

input {
    touchpad {
        natural_scroll = no
    }
    follow_mouse = 1
    kb_layout = us
    kb_model =
    kb_options =
    kb_rules =
    kb_variant =
    sensitivity = 0
}

master {
    new_is_master = true
}

misc {
    force_default_wallpaper = -1
}

# extraConfig
monitor = ,preferred,auto,auto

# Execute your favorite apps at launch
# exec-once = waybar & hyprpaper & firefox
exec-once = waybar

# Source a file (multi-file configs)
# source = ~/.config/hypr/myColors.conf

# Wallpaper
exec-once = swaybg -i ~/Pictures/Wallpapers/163856-taro_plant-plant-leaf-botany-terrestrial_plant-2560x1440.jpg -m fill

# Some default env vars.
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt5ct # change to qt6ct if you have that

env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = WLR_NO_HARDWARE_CURSORS,1
